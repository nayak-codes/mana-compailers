<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rust gear logo - official orange/brown color #CE422B -->
  
  <!-- Outer gear ring with teeth -->
  <g fill="#CE422B">
    <!-- Gear body -->
    <circle cx="64" cy="64" r="48" fill="#CE422B"/>
    <circle cx="64" cy="64" r="38" fill="#1a1a1a"/>
    <circle cx="64" cy="64" r="28" fill="#CE422B"/>
    <circle cx="64" cy="64" r="12" fill="#1a1a1a"/>
    
    <!-- Gear teeth - 8 teeth -->
    <rect x="58" y="12" width="12" height="18" rx="3"/>
    <rect x="58" y="98" width="12" height="18" rx="3"/>
    <rect x="12" y="58" width="18" height="12" rx="3"/>
    <rect x="98" y="58" width="18" height="12" rx="3"/>
    
    <!-- Diagonal teeth -->
    <rect x="24" y="24" width="12" height="18" rx="3" transform="rotate(45 30 33)"/>
    <rect x="92" y="24" width="12" height="18" rx="3" transform="rotate(-45 98 33)"/>
    <rect x="24" y="86" width="12" height="18" rx="3" transform="rotate(-45 30 95)"/>
    <rect x="92" y="86" width="12" height="18" rx="3" transform="rotate(45 98 95)"/>
  </g>
  
  <!-- Spokes in the ring -->
  <g stroke="#CE422B" stroke-width="6" fill="none">
    <line x1="64" y1="36" x2="64" y2="52"/>
    <line x1="64" y1="76" x2="64" y2="92"/>
    <line x1="36" y1="64" x2="52" y2="64"/>
    <line x1="76" y1="64" x2="92" y2="64"/>
    <line x1="43" y1="43" x2="52" y2="52"/>
    <line x1="76" y1="76" x2="85" y2="85"/>
    <line x1="85" y1="43" x2="76" y2="52"/>
    <line x1="52" y1="76" x2="43" y2="85"/>
  </g>
</svg>