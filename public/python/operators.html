<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=/blog-python/07-numbers-and-math-operations.html"><link rel="canonical" href="https://www.ourcompiler.com/blog-python/07-numbers-and-math-operations.html">  <script src="/site-footer.js" defer></script>
  <link rel="stylesheet" href="/pages.css" />

  <script>
    (function() {
      const currentTheme = localStorage.getItem('theme') || 'dark';
      if (currentTheme === 'light') {
        document.documentElement.classList.add('light-theme');
        document.addEventListener('DOMContentLoaded', () => {
          document.body.classList.add('light-theme');
        });
      }
      window.addEventListener('DOMContentLoaded', () => {
        const nav = document.querySelector('.topnav') || document.querySelector('.header-container') || document.querySelector('header');
        if (!nav || nav.querySelector('.blog-theme-toggle')) return;
        const toggleBtn = document.createElement('button');
        toggleBtn.className = 'blog-theme-toggle';
        toggleBtn.style.cssText = 'margin-left: auto; flex-shrink: 0; background: rgba(255, 255, 255, 0.15); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 6px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: "Inter", sans-serif; transition: all 0.2s; white-space: nowrap; margin-right: 12px;';
        const updateText = () => {
          const isLight = document.body.classList.contains('light-theme');
          toggleBtn.innerHTML = isLight ? '🌙 Dark' : '☀️ Light';
        };
        updateText();
        toggleBtn.addEventListener('click', () => {
          document.body.classList.toggle('light-theme');
          document.documentElement.classList.toggle('light-theme');
          const isLight = document.body.classList.contains('light-theme');
          localStorage.setItem('theme', isLight ? 'light' : 'dark');
          updateText();
        });
        nav.appendChild(toggleBtn);
      });
    })();
  </script>
</head><body><p>Redirecting to <a href="/blog-python/07-numbers-and-math-operations.html">/blog-python/07-numbers-and-math-operations.html</a>...</p>  <footer class="footer" id="site-footer"></footer>
</body></html>
